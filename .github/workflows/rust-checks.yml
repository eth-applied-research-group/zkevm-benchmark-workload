name: Rust Checks
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check --all

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libbenchmark-dev \
            libgmp-dev \
            libomp-dev \
            libopenmpi-dev \
            libsodium-dev \
            nasm \
            nlohmann-json3-dev \
            openmpi-bin \
            openmpi-common

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libbenchmark-dev \
            libgmp-dev \
            libomp-dev \
            libopenmpi-dev \
            libsodium-dev \
            nasm \
            nlohmann-json3-dev \
            openmpi-bin \
            openmpi-common

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check documentation
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libbenchmark-dev \
            libgmp-dev \
            libomp-dev \
            libopenmpi-dev \
            libsodium-dev \
            nasm \
            nlohmann-json3-dev \
            openmpi-bin \
            openmpi-common

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run default tests
        run: cargo test --locked --workspace -- --no-capture
